name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    name: Build, typecheck, and contracts
    if: github.repository == 'Driftward-LLC/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.source.outputs.sha }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Bind checked revision and complete test matrix
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan every full unit suite shard
        id: plan
        run: python3 scripts/fork-ci/test-plan.py
      - name: Free hosted runner disk for release and debug build outputs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af
          df -h
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install PyYAML==6.0.2
      - name: Workflow policy tests
        run: python3 -m unittest discover -s scripts/fork-ci -p 'test_*.py'
      - name: Inherited workflow contracts
        run: |
          node --test \
            scripts/__tests__/e2e-shard.test.mjs \
            scripts/__tests__/eval-schedule-monitor.test.mjs \
            scripts/__tests__/prepare-runner-release-image.test.mjs \
            scripts/__tests__/public-install-closure.test.mjs \
            scripts/__tests__/release-verify-workflow.test.mjs \
            scripts/__tests__/run-vitest-stable-shard.test.mjs \
            scripts/__tests__/runner-debug-crate-cache.test.mjs \
            scripts/__tests__/runner-release-crate-cache.test.mjs \
            scripts/__tests__/storybook-deploy.test.mjs \
            scripts/ci/test-selection-pr-timings.test.mjs \
            scripts/ci/test-selection-timings.test.mjs \
            scripts/ci/test-selection-workflow.test.mjs \
            scripts/cloud-migrator-artifacts.test.mjs \
            scripts/cloud-source-verification.test.mjs \
            scripts/preview-artifacts.test.mjs \
            scripts/release-lib.test.mjs \
            scripts/reuse-canary-image.test.mjs
      - name: Build workspace
        run: pnpm build
      - name: Typecheck every workspace
        run: pnpm -r typecheck
      - name: Build native test fixtures once
        run: pnpm --filter @paperclipai/paperclip-runner build:runner-binaries
      - name: Archive built workspace and synthetic fixtures
        run: |
          python3 scripts/fork-ci/build-artifact.py
          du -h workspace-build.tar.gz
          df -h
      - name: Share only this run's build outputs
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: workspace-build.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  tests:
    name: Unit tests (${{ matrix.label }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI: 'true'
      PAPERCLIP_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: .fork-build
          merge-multiple: true
      - name: Restore same-revision workspace outputs
        run: |
          tar -xzf .fork-build/workspace-build.tar.gz --no-same-owner
          pnpm run preflight:workspace-links
      - name: Run this full-suite partition
        env:
          TEST_ARGS: ${{ toJSON(matrix.args) }}
          PAPERCLIP_TEST_PREBUILT_RUNNER: ${{ github.workspace }}/packages/paperclip-runner/runner/target/release/paperclip-runnerd
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          subprocess.run(['node', 'scripts/run-vitest-stable.mjs', *json.loads(os.environ['TEST_ARGS'])], check=True)
          PYTHON
  validation:
    name: Validation
    needs: [prepare, tests]
    if: ${{ always() && github.repository == 'Driftward-LLC/paperclip' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require build, contracts, typecheck, and every unit partition
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'prepare', 'tests'}, 'Missing required CI job'
          assert all(job['result'] == 'success' for job in results.values()), results
          PYTHON
